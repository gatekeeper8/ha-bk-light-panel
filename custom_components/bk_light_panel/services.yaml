  fields:
    weather:
      required: true
      selector:
        entity:
          domain: weather
    history:
      selector:
        entity:
          domain: sensor
    hours_back:
      default: 6
      selector:
        number:
          min: 0
          max: 12
          unit_of_measurement: h
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: s
    frame_interval:
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
