        text:

show_traffic:
  fields:
    download:
      required: true
      selector:
        entity:
          domain: sensor
    upload:
      selector:
        entity:
          domain: sensor
    minutes:
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    max_rate:
      selector:
        number:
          min: 0.1
          max: 100000
          step: any
          mode: box
          unit_of_measurement: Mbit/s
    duration:
      default: 10
      selector:
        number:
          min: 0
